services:
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - cert-volume:/etc/letsencrypt/
      - cert-volume:/var/log/letsencrypt/
      #- cert-volume:/var/lib/letsencrypt/
    command: certonly --standalone -d $site_address -d www.$site_address -d en.$site_address -d www.en.$site_address -m $cert_email --agree-tos --no-eff-email --keep-until-expiring 
    ports:
      - "80:80"
    restart: "no"

  betting-client:
    build:
      context: ./BettingClient/
      additional_contexts:
        precompiled: ${PRECOMPILED_DIR:-./precompiled}
      dockerfile: ${client_docker_file:-Dockerfile-builder}
      args:
        CONFIGURATION: ${configuration:-standard}
    container_name: betting-client
    volumes:
      - ${instance_directory}:/BettingInstance/      
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config.json:/usr/share/nginx/html/hu/config.json:ro
      - ./en-config.json:/usr/share/nginx/html/en/config.json:ro
      - cert-volume:/etc/letsencrypt/:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      certbot:
        condition: service_completed_successfully
      betting-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${CPU_LIMIT}
          memory: ${MEM_LIMIT}

  betting-server:
    build: ./BettingServer/
    container_name: betting-server
    volumes:
      - ${instance_directory}:/BettingInstance/
    depends_on:
      certbot:
        condition: service_completed_successfully

volumes:
  cert-volume:
