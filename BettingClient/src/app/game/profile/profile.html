<main class="container">
    <div class="form-signin w-100 m-auto d-flex justify-content-center">
        <div class="col-10 col-md-6">
            <h1 class="h3 mb-3 fw-normal">Profile</h1>
    
            <app-user-editor [userData]="userData" [disabledAfterRegister]="true"></app-user-editor>
            <app-reminder [userData]="userData"></app-reminder>

        @for (alert of alerts; track alert) {
            <ngb-alert class="mt-2" [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
        }

            <button class="btn btn-primary w-100 mt-3 py-2 col-6 form-group" type="submit" (click)="postProfile()" i18n="save">Save</button>
        </div>
    </div>
</main>
