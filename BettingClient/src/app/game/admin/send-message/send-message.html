 <div class="container">
    <div class="mb-3">
        <label for="notificationSubject" class="form-label" i18n="@@subject">Subject</label>
        <input class="form-control" id="notificationSubject" [(ngModel)]="subject">
    </div>
    <div class="mb-3">
        <label for="notificationText" class="form-label" i18n="@@message">Message</label>
        <textarea class="form-control" id="notificationText" rows="3" [(ngModel)]="message"></textarea>
    </div>
    <button class="btn btn-primary btn-sm mt-2 mb-2" type="button" id="notificationSend" (click)="sendMessage()" i18n="@@send">Send</button> 

@for (alert of alerts; track alert) {
    <ngb-alert [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
}
</div>
