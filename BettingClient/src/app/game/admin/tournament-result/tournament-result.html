<div class="container">
@for(bet of tournamentBets; track bet) {
    <div class="row ms-3 mt-2">
        <div class="col-1">{{$index + 1}}</div>
        <div class="col-3 col-md-2">{{bet.username}}</div>
        <div class="col-3 col-md-2">{{bet.local_name}}</div>
        <div class="col-3 col-md-2">{{bet.result | resultName }}</div>
        <div ngbDropdown class="col-2">
            <button type="button" class="btn btn-outline-primary" id="dropdownBasic1" ngbDropdownToggle>
                {{getSuccessName(bet.success)}}
            </button>
            <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
                <button ngbDropdownItem (click)="selectSuccess(bet, 0)">{{getSuccessName(0)}}</button>
                <button ngbDropdownItem (click)="selectSuccess(bet, 1)">{{getSuccessName(1)}}</button>
                <button ngbDropdownItem (click)="selectSuccess(bet, 2)">{{getSuccessName(2)}}</button>
            </div>
        </div>
    </div>
}

@if (tournamentBets.length > 0) {
    <button class="btn btn-primary btn-sm ms-3 mt-3 mb-1" type="button" id="send" (click)="postTournamentBets()">Send</button> 
}
@else {
    <h6 class="row mt-3 ms-2 mb-3" i18n="@@tournamentLater">Tournament bet evaluation will take place later.</h6>
}

@for (alert of alerts; track alert) {
    <ngb-alert [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
}
</div>
