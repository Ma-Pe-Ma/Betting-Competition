<div class="container">
    <div class="row ms-2 mt-2">
        <div class="col-md-4">
            <label for="databaseFile" i18n="@@dbFile">Database file</label>
            <input type="file" name="database" id="databaseFile" accept=".sqlite" (change)="onFileSelected($event)">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary btn-sm" type="button" id="databaseUpload" (click)="uploadDB()" i18n="@@upload">Upload</button>
        </div>
    </div>
    <div class="row ms-2 mt-2">
        <form class="col-md-2" method="GET" action="{{serverAddress}}/admin/database">
            <button class="btn btn-primary btn-sm" type="submit" i18n="@@download">Download</button>
        </form>
    </div>
    <div class="row ms-2 mt-2">
        <form class="col-md-4" method="GET" action="{{serverAddress}}/admin/log">
            <label for="logButton"i18n="@@logFile">Log-file</label>
            <button class="btn btn-primary btn-sm" type="submit" id="logButton" i18n="@@download">Download</button>
        </form>
    </div>
    <div class="row ms-2 mt-2">
        <div class="col-md-4" (click)="launchRequest('/admin/maintenance-set')">
            <label for="logButton" i18n="@@maintenanceMode">Maintenance-mode</label>
            <button class="btn btn-primary btn-sm" type="submit" i18n="@@toggle">Toggle</button>
        </div>
    </div>
    <div class="row ms-2 mt-2">
        <div class="col-md-4" (click)="launchRequest('/admin/manual-daily-checker')">
            <label for="logButton" i18n="@@dailyChecker">Daily checker</label>
            <button class="btn btn-primary btn-sm" type="submit" id="logButton" i18n="@@launch">Launch</button>
        </div>
    </div>
    <div class="row ms-2 mt-2 mb-2">
        <div class="" i18n="@@scheduledTasks">Scheduled tasks</div>
        @for (task of scheduledTasks; track task) {
            <div class="ms-3">
                {{$index + 1}} - {{task}}
            </div>
        }    
        @if (scheduledTasks.length == 0) {
            <div class="ms-3" i18n="@@none">None</div>
        } 
    </div>
@for (alert of alerts; track alert) {
    <ngb-alert [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
}
</div>
