<div class="container">
    @for (alert of alerts; track alert) {
    <ngb-alert [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
    }

    <div class="row d-flex justify-content-center ">
        <div class="row col-12 col-md-8">
            <div class="col-4 d-flex justify-content-start">
                <button type="button" class="btn btn-primary btn-sm" i18n="@@older" [disabled]="previousDisabled"
                    (click)="getComments('<')">Older</button>
                <div class="spinner-border d-flex ms-1 d-none" id="oldSpinner"></div>
            </div>
            <div class="col-4 d-flex justify-content-center">
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal"
                    data-bs-target="#commentModal" id="newCommentButton" i18n="@@newComment"
                    (click)="showNewCommentModal()">New comment</button>
            </div>
            <div class="col-4 d-flex justify-content-end">
                <div class="spinner-border d-flex me-1 d-none" id="newSpinner"></div>
                <button type="button" class="btn btn-primary btn-sm" i18n="@@newer"
                    (click)="getComments('>')">Newer</button>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <div class="d-flex flex-column align-items-stretch flex-shrink-0 bg-body-tertiary col-12 col-md-8">
            <div
                class="d-flex align-items-center flex-shrink-0 p-3 link-body-emphasis text-decoration-none border-bottom">
                <svg class="bi pe-none me-2" width="30" height="24">
                    <use xlink:href="#bootstrap" />
                </svg>
                <span class="fs-5 fw-semibold">Chat</span>
            </div>
            <div class="list-group list-group-flush border-bottom scrollarea" id="commentContainer">
                @for(chatMessage of chatMessages; track chatMessage) {
                <div class="list-group-item list-group-item-action py-3 lh-sm" aria-current="true" id="commentRoot">
                    <div class="row">
                        <div class="col-6 col-sm-3 d-flex flex-column align-items-start">
                            <strong class="mb-1" id="commentHeader">{{chatMessage.username}}</strong>

                            <img src="{{chatMessage.image_path}}" alt="" width="96" height="96" class="mb-2 rounded">

                            <small class="text-center" style="width: 96px;">
                                <span>{{chatMessage.datetime | localDate:user.timezone!:'date'}}</span>
                                <br>
                                <span class="text-muted">{{chatMessage.datetime |
                                    localDate:user.timezone!:'time'}}</span>
                            </small>
                        </div>
                        <markdown class="col-12 col-sm-9 mt-4 mt-sm-0" [data]="chatMessage.comment"></markdown>
                    </div>
                </div>
                }
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-3 mb-3">
        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#commentModal"
            id="newCommentButton" i18n="@@newComment" (click)="showNewCommentModal()">New comment</button>
    </div>
</div>
