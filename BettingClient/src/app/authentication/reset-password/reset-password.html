<div class="container">
    <div class="form-signin w-100 m-auto d-flex justify-content-center">
        <div class="col-12 col-md-6">
            <h1 class="h3 mb-3 fw-normal" i18n="resetPassword">Reset password</h1>
        
            <div class="col-12">
                <label for="lastName" class="form-label" i18n="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="" [(ngModel)]="email">
                <div class="invalid-feedback" i18n="validUsername">
                    A valid username is required.
                </div>
            </div>

            <div class="col-12">
                <label for="lastName" class="form-label" i18n="resetKey">Reset-key</label>
                <input type="text" class="form-control" id="key" name="key" placeholder="" [(ngModel)]="key">
                <div class="invalid-feedback" i18n="validKey">
                    A valid key is required.
                </div>
            </div>

            <div class="col-12 mt-2">
                <label for="password1" class="form-label" i18n="newPw">New password</label>
                <input type="password" class="form-control" id="password1" placeholder="" name="password1" required [(ngModel)]="password1">
                <div class="invalid-feedback" i18n="validPassword">
                    A valid password is required.
                </div>
            </div>

            <div class="col-12 mt-2">
                <label for="password2" class="form-label" i18n="newPwAgain">New password again</label>
                <input type="password" class="form-control" id="password2" placeholder="" required [(ngModel)]="password2">
                <div class="invalid-feedback" i18n="validPassword">
                    A valid password is required.
                </div>
            </div>

            @for (alert of alerts; track alert) {
	            <ngb-alert class="mt-2" [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
            }

            <button class="btn btn-primary mt-3 w-100 py-2 col-6 form-group" type="submit" (click)="resetPassword()">Reset password</button>
        </div>
    </div>
</div>
