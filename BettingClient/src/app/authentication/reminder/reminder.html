<h5 class="mt-1" i18n="browserNotifications">Browser notifications</h5>

<div class="form-group mt-2">
    <label class="form-group" id="matchReminderDisplay" i18n="matchReminderLabel">
        Match reminder (1 hour before the starting of the first match)
    </label>

    <div class="form-check ms-3">
        <input class="form-check-input" type="radio" name="reminder" id="matchRadios1" [value]="1" [(ngModel)]="userData.reminder">
        <label class="form-check-label" for="matchRadios1" id="reminder1Display" i18n="reminderOnNoBetLabel">
            On those days when there is a match without a bet
        </label>
    </div>
    <div class="form-check ms-3">
        <input class="form-check-input" type="radio" name="reminder" id="matchRadios2" [value]="2" [(ngModel)]="userData.reminder">
        <label class="form-check-label" for="matchRadios2" id="reminder2Display" i18n="reminderEveryMatchdayLabel">
            Every matchday
        </label>
    </div>

    <div class="form-check ms-3">
        <input class="form-check-input" type="radio" name="reminder" id="matchRadios3" [value]="0" [(ngModel)]="userData.reminder" checked>
        <label class="form-check-label" for="matchRadios3" id="reminder3Display" i18n="reminderNoRemindersLabel">
            I don't want to receive reminders
        </label>
    </div>
</div>

<div class="form-group mt-2">
    <label class="form-group" id="standingsDisplay" i18n="standingsNotificationLabel">
        Standings notification at the end of matchdays
    </label>
    <div class="form-check ms-3">
        <input class="form-check-input" type="radio" name="summary" id="summaryRadios2" [value]="1" [(ngModel)]="userData.summary">
        <label class="form-check-label" for="summaryRadios2" id="standing1Display" i18n="standingsYesLabel">
            Yes
        </label>
    </div>

    <div class="form-check ms-3">
        <input class="form-check-input" type="radio" name="summary" id="summaryRadios1" [value]="0" [(ngModel)]="userData.summary" checked>
        <label class="form-check-label" for="summaryRadios1" id="standing2Display" i18n="standingsNoLabel">
            No
        </label>
    </div>
</div>
