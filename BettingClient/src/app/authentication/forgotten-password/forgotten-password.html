<main class="container">
    <div class="form-signin w-100 m-auto d-flex justify-content-center">
        <div class="col-12 col-md-6">        
            <h1 class="h3 mb-3 fw-normal" i18n="forgotten">Forgotten password</h1>
    
            <div class="mb-3 alert alert-info" role="alert" i18n="specify_address">
                Please specify your email address for password recovery!
            </div>
            
            <div class="col-12 mt-2">
                <label for="email" class="form-label">Email <span class="text-body-secondary"></span></label>
                <input type="email" class="form-control" id="email" i18n-placeholder="@@email_placeholder" placeholder="email@address.com" name="email" [(ngModel)]="email">
                <div class="invalid-feedback" i18n="enter_email">
                    Please enter a valid email address.
                </div>
            </div>

            @for (alert of alerts; track alert) {
	            <ngb-alert class="mt-2" [type]="alert.type" (closed)="close(alert)">{{ alert.message }}</ngb-alert>
            }

            <button class="btn btn-primary mt-2 w-100 py-2 col-6 form-group" type="submit" i18n="reset_password" (click)="requestNewPassword()">Reset password</button>
        </div>
    </div>
</main>
